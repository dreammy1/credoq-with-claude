name: Credoq Suite — Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run harness test suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP lint every plugin file (fatal syntax check)
        run: |
          set -e
          find plugins -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Run the cross-plugin harness suite
        env:
          CREDOQ_PLUGINS_DIR: ${{ github.workspace }}/plugins
        run: ./run-all.sh

      - name: Summary
        if: always()
        run: |
          echo "### Credoq Suite Test Results (PHP ${{ matrix.php }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Full harness output is in the 'Run the cross-plugin harness suite' step above." >> $GITHUB_STEP_SUMMARY
